[package]
name = "ccgui-next"
version = "1.0.6"
description = "CC GUI - multi-CLI AI chat desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ccgui_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
regex = "1"
toml = "0.8"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros", "net", "process", "time", "sync", "io-util"] }
sha2 = "0.10"
dirs = "6"
dunce = "1"
# Local repository operations (status/diff/index/commit/branches/checkout) use
# libgit2, but with default features disabled: git2's "https" and "ssh" features
# are the only things that pull in openssl-sys (libgit2's HTTPS backend and
# libssh2's unix crypto backend are OpenSSL — neither supports rustls), and the
# previous `openssl-sys = { features = ["vendored"] }` forced a from-source
# OpenSSL build. With both features off the crate links no OpenSSL at all; the
# network steps (fetch/push) are delegated to the system `git` binary in
# src/git.rs, which owns TLS, credentials and SSH.
git2 = { version = "0.20", default-features = false }
trash = "5"
# .gitignore-aware directory walking for the @-mention file index.
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
base64 = "0.22"
zstd = "0.13"
which = "7"
# PTY for the integrated terminal panel.
portable-pty = "0.8"
sysinfo = "0.36.1"
libc = "0.2"
# LAN web access: serves the built frontend and bridges the command/event
# surface over a token-authenticated WebSocket (see src/web.rs).
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
# DSH host session streams (ws:// loopback mux) plus the outbound relay, which
# dials the Cloudflare Worker over wss:// — hence the TLS feature.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
serde_yaml = "0.9"
# Linux-native Baidu Tongji transport: fixed hm.js fetch + hm.gif beacon with
# rustls so it never touches WebKit networking.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart", "json"] }

[target.'cfg(windows)'.dependencies]
# Live User/Machine PATH for CLI discovery: a GUI process inherits the PATH
# snapshot of its launcher, so engine::resolve re-reads the registry at
# detection time to see CLIs installed while the app is running.
winreg = "0.55"
# Job Objects (engine/job.rs): kill-on-close membership for spawned CLIs so
# an orphaned grandchild (a CLI's pwsh.exe and its hidden conhost.exe) dies
# with the run. taskkill /T can only walk a tree whose root is still alive,
# which is exactly what an orphan no longer has.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# `start_paused`/`time::advance` in the relay retry tests: their backoff is
# real time, and a test that has to wait it out is a test nobody runs.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
# Unwind (not abort): a panicking thread must still run destructors so engine
# child processes get reaped instead of leaked.
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = true
